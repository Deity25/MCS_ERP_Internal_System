server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: stockwise-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockwise}
    username: ${DB_USERNAME:stockwise}
    password: ${DB_PASSWORD:stockwise}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 30000
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 30s
      cache-null-values: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 3000
        request.timeout.ms: 2000
        max.block.ms: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:local-only-change-me-before-deploying-32chars}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
logging:
  level:
    com.stockwise: INFO
